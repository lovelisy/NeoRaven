name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      name: ${{ steps.meta.outputs.name }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 8 for the Minecraft 1.8.9 toolchain
        id: jdk8
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "8"

      - name: Remember the JDK 8 path
        id: jdk8path
        run: echo "path=$JAVA_HOME" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17 for Gradle
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Read project version and resolve release metadata
        id: meta
        run: |
          set -euo pipefail
          VERSION=$(grep -E '^version = ' build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=latest" >> "$GITHUB_OUTPUT"
          echo "name=NeoRaven Latest" >> "$GITHUB_OUTPUT"
          echo "Building NeoRaven $VERSION into the rolling latest release"

      - name: Build
        env:
          JDK8_PATH: ${{ steps.jdk8path.outputs.path }}
        run: ./gradlew build remapJar --no-daemon -Porg.gradle.java.installations.paths="$JDK8_PATH"

      - name: Show built artifacts
        run: ls -lh build/libs

      - name: Upload the mod jar
        uses: actions/upload-artifact@v4
        with:
          name: NeoRaven
          path: build/libs/NeoRaven.jar
          if-no-files-found: error
          retention-days: 7

  release:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout the release commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Point the rolling tag at this build
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "${{ needs.build.outputs.tag }}" "${{ github.sha }}"
          git push --force origin "refs/tags/${{ needs.build.outputs.tag }}"

      - name: Download the built jar
        uses: actions/download-artifact@v4
        with:
          name: NeoRaven
          path: dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: ${{ needs.build.outputs.name }}
          files: dist/NeoRaven.jar
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
