name: Build and Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (leave empty for v<version>-build.<run number>)"
        required: false
        type: string
      release_name:
        description: "Release title (leave empty to use the tag)"
        required: false
        type: string
      prerelease:
        description: "Mark the release as a pre-release"
        required: false
        default: false
        type: boolean
      draft:
        description: "Create the release as a draft"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      name: ${{ steps.meta.outputs.name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 8 for the Minecraft 1.8.9 toolchain
        id: jdk8
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "8"

      - name: Remember the JDK 8 path
        id: jdk8path
        run: echo "path=$JAVA_HOME" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17 for Gradle
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Read project version and resolve release metadata
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_NAME: ${{ inputs.release_name }}
        run: |
          set -euo pipefail
          VERSION=$(grep -E '^version = ' build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          TAG="${INPUT_TAG:-v${VERSION}-build.${GITHUB_RUN_NUMBER}}"
          NAME="${INPUT_NAME:-$TAG}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Building NeoRaven $VERSION as $TAG"

      - name: Build
        env:
          JDK8_PATH: ${{ steps.jdk8path.outputs.path }}
        run: ./gradlew build remapJar --no-daemon -Porg.gradle.java.installations.paths="$JDK8_PATH"

      - name: Show built artifacts
        run: ls -lh build/libs

      - name: Upload the mod jar
        uses: actions/upload-artifact@v4
        with:
          name: NeoRaven
          path: build/libs/RavenB4.jar
          if-no-files-found: error
          retention-days: 7

  release:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download the built jar
        uses: actions/download-artifact@v4
        with:
          name: NeoRaven
          path: dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: ${{ needs.build.outputs.name }}
          files: dist/RavenB4.jar
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
